<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pegawai</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2f5d8c;
            color: white;
            padding: 14px 10px;
            border: 1px solid #ddd;
        }

        td {
            padding: 13px 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tfoot td {
            font-weight: bold;
            background-color: #e8eef5;
        }

        .total {
            color: #1f4f7a;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Data Pegawai</h1>

        <table>
            <thead>
                <tr>
                    <th>Nama Pegawai</th>
                    <th>Umur</th>
                    <th>Jabatan</th>
                    <th>Status</th>
                    <th>Gaji Pokok</th>
                    <th>Tunjangan Jabatan</th>
                    <th>BPJS</th>
                    <th>Tunjangan Keluarga</th>
                </tr>
            </thead>

            <tbody id="dataPegawai">
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">Total Gaji</td>
                    <td colspan="4" class="total" id="totalGaji"></td>
                </tr>
            </tfoot>
        </table>

    </div>

    <script>
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        let gajiPokok;

        if (jabatan == "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gajiPokok = 10000000;
        } else if (jabatan == "Staff") {
            gajiPokok = 5000000;
        }

        let tunjanganJabatan = gajiPokok * 15 / 100;

        let bpjs = gajiPokok * 10 / 100;

        let tunjanganKeluarga = status == "Menikah"
            ? gajiPokok * 20 / 100
            : 0;

        let totalGaji = gajiPokok
            + tunjanganJabatan
            + bpjs
            + tunjanganKeluarga;

        function rupiah(angka) {
            return new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                minimumFractionDigits: 0
            }).format(angka);
        }

        document.getElementById("dataPegawai").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur} Tahun</td>
                <td>${jabatan}</td>
                <td>${status}</td>
                <td>${rupiah(gajiPokok)}</td>
                <td>${rupiah(tunjanganJabatan)}</td>
                <td>${rupiah(bpjs)}</td>
                <td>${rupiah(tunjanganKeluarga)}</td>
            </tr>
        `;

        document.getElementById("totalGaji").innerHTML = rupiah(totalGaji);
    </script>

</body>
</html>
